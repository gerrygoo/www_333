<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paranormal Dynamics, Inc.</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
</head>
<body>
    <div class="visual-effects-overlay scanlines"></div>
    <canvas id="crt-noise"></canvas>
    <div class="cursor-glow"></div>
    
    <!-- CRT RGB Split Filter -->
    <svg class="svg-filters" aria-hidden="true" focusable="false">
      <defs>
        <filter id="rgb-split">
          <feOffset in="SourceGraphic" dx="-6" dy="0" result="red"/>
          <feOffset in="SourceGraphic" dx="6" dy="0" result="blue"/>
          <feComponentTransfer in="red" result="red-only">
            <feFuncG type="table" tableValues="0 0"/>
            <feFuncB type="table" tableValues="0 0"/>
          </feComponentTransfer>
          <feComponentTransfer in="blue" result="blue-only">
            <feFuncR type="table" tableValues="0 0"/>
            <feFuncG type="table" tableValues="0 0"/>
          </feComponentTransfer>
          <feBlend in="red-only" in2="blue-only" mode="screen" result="split"/>
          <feBlend in="split" in2="SourceGraphic" mode="screen"/>
        </filter>
        
        <filter id="rgb-split-intense">
          <feOffset in="SourceGraphic" dx="-15" dy="0" result="red"/>
          <feOffset in="SourceGraphic" dx="15" dy="0" result="blue"/>
          <feComponentTransfer in="red" result="red-only">
            <feFuncG type="table" tableValues="0 0"/>
            <feFuncB type="table" tableValues="0 0"/>
          </feComponentTransfer>
          <feComponentTransfer in="blue" result="blue-only">
            <feFuncR type="table" tableValues="0 0"/>
            <feFuncG type="table" tableValues="0 0"/>
          </feComponentTransfer>
          <feBlend in="red-only" in2="blue-only" mode="screen" result="split"/>
          <feBlend in="split" in2="SourceGraphic" mode="screen"/>
        </filter>
        <filter id="cursor-warp-s" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feTurbulence id="warp-s-turb" type="fractalNoise" baseFrequency="0.006 0.005" numOctaves="3" seed="42" result="noise"/>
          <feDisplacementMap id="warp-s-disp" in="SourceGraphic" in2="noise" scale="52" xChannelSelector="R" yChannelSelector="G"/>
          <feFlood flood-color="red" flood-opacity="1"/>
        </filter>
        <filter id="cursor-warp" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feImage id="warp-disp-img" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="dispmap"/>
          <feDisplacementMap id="warp-displace" in="SourceGraphic" in2="dispmap" scale="1" xChannelSelector="R" yChannelSelector="G" result="warped"/>
          <feComposite in="warped" in2="dispmap" operator="in" result="localized"/>
          <feComposite in="SourceGraphic" in2="dispmap" operator="out" result="bg"/>
          <feComposite in="localized" in2="bg" operator="over"/>
        </filter>
      </defs>
    </svg>

    <main class="hero">
        <div class="hero__logo-wrap">
            <img src="images/logos/pdi_logo_v2.6_black.png" alt="Paranormal Dynamics Inc. Logo" class="hero__logo">
        </div>
        <div class="hero__tagline-group">
            <p class="hero__tagline">designer films and exorcisms</p>
            <a href="https://instagram.com/paranormal_dynamics_inc" target="_blank" rel="noopener noreferrer" class="instagram-link">@paranormal_dynamics_inc</a>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
